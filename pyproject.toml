[project]
name = "ledgerline"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==2.9.0",
    "defusedxml==0.7.1",
    "docling==2.145.0",
    "duckdb==2.0.0",
    "fastapi==0.163.1",
    "fastembed==0.9.1",
    "httpx==0.28.1",
    "langgraph==1.2.19",
    "matplotlib==3.11.2",
    "mcp==2.3.0",
    "neo4j==5.28.8",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "psycopg[binary]==3.3.9",
    "pyarrow==26.0.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "pypdfium2==5.15.2",
    "python-docx==1.2.0",
    "pyyaml==6.0.3",
    "qdrant-client==1.20.0",
    "reportlab==5.1.0",
    "sqlalchemy==2.1.8",
    "sse-starlette==3.7.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
mining = [
    "pm4py==2.7.23.11",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.170.15",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "types-pyyaml==6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"evals/**" = ["S603", "S607"]
"scripts/**" = ["S311", "E402"]
"synth/**" = ["S311", "E501", "S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ledgerline.core.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  "integration: needs docker services",
  "llm: makes real Anthropic API calls (costs money)",
]

[tool.coverage.run]
source = ["ledgerline"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
