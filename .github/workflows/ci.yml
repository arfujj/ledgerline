name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.6"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: make lint
      - run: make typecheck
      - run: make test
